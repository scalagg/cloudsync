plugins {
    id "maven-publish"
    id "com.jfrog.artifactory" version "4.28.2"
    id "com.github.johnrengelman.shadow" version "7.1.2"
    id "org.jetbrains.kotlin.jvm" version "1.6.20"
    id "org.jetbrains.kotlin.kapt" version "1.6.20"
}

String environmental(String key)
{
    final String environment =
        System.getenv(key)

    if (environment != null)
    {
        return environment
    }

    return project.property(key)
}

allprojects {
    group "gg.scala.cloudsync"
    version "1.0.1"

    description "Advanced server <-> cloud synchronization platform"

    repositories {
        mavenCentral()

        maven {
            url "${environmental("artifactory_contextUrl")}/gradle-release"
            credentials {
                username environmental("artifactory_user")
                password environmental("artifactory_password")
            }
        }

        maven { url "https://jitpack.io" }
        maven { url "https://oss.sonatype.org/content/repositories/snapshots" }
    }
}

subprojects {
    apply plugin: "maven-publish"
    apply plugin: "com.github.johnrengelman.shadow"

    apply plugin: "org.jetbrains.kotlin.jvm"
    apply plugin: "org.jetbrains.kotlin.kapt"

    apply plugin: "com.jfrog.artifactory"

    dependencies {
        if (project.name != "shared") {
            implementation project(":shared")
        }

        compileOnly "gg.scala.flavor:flavor:0.1.3.7"
        compileOnly "com.konghq:unirest-java:3.13.6:standalone"

        compileOnly "com.google.guava:guava:31.0.1-jre"
        compileOnly "commons-io:commons-io:2.11.0"

        compileOnly "gg.scala.commons:serializers:2.0.0"
    }

    compileKotlin {
        kotlinOptions.javaParameters = true
        kotlinOptions.jvmTarget = "1.8"
    }

    shadowJar {
        archiveClassifier.set("")

        exclude "**/*.kotlin_metadata"
        exclude "**/*.kotlin_builtins"
        exclude "META-INF/"

        archiveFileName = "cloudsync.jar"
    }

    publishing {
        publications {
            shadow(MavenPublication) { publication ->
                project.shadow.component(publication)
            }
        }

        repositories {
            maven {
                name "scala"
                url "${environmental("artifactory_contextUrl")}/gradle-release"

                credentials {
                    username environmental("artifactory_user")
                    password environmental("artifactory_password")
                }
            }
        }
    }

    tasks.build.dependsOn(
        shadowJar,
        publishShadowPublicationToScalaRepository
    )
}

artifactory {
    this.contextUrl = environmental("artifactory_contextUrl")

    publish {
        repository {
            repoKey = environmental("artifactory_release_local")
            username = environmental("artifactory_user")
            password = environmental("artifactory_password")
            maven = true
        }
    }
}
