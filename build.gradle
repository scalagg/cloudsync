plugins {
    id "maven-publish"
    id "com.jfrog.artifactory" version "4.28.2"
    id "com.github.johnrengelman.shadow" version "7.1.2"
    id "org.jetbrains.kotlin.jvm" version "1.7.20"
    id "org.jetbrains.kotlin.kapt" version "1.7.10"
}

allprojects {
    group "gg.scala.cloudsync"
    version "1.0.3"

    description "Advanced server <-> cloud synchronization platform"

    repositories {
        mavenCentral()

        maven {
            url "${property("artifactory_contextUrl")}/gradle-release"
            credentials {
                username property("artifactory_user")
                password property("artifactory_password")
            }
        }

        maven { url "https://jitpack.io" }
        maven { url "https://oss.sonatype.org/content/repositories/snapshots" }
    }
}

subprojects {
    apply plugin: "maven-publish"
    apply plugin: "com.github.johnrengelman.shadow"

    apply plugin: "org.jetbrains.kotlin.jvm"
    apply plugin: "org.jetbrains.kotlin.kapt"

    apply plugin: "com.jfrog.artifactory"

    dependencies {
        if (project.name != "shared") {
            implementation project(":shared")
        }

        implementation "gg.scala.flavor:flavor:0.1.6"
        implementation "gg.scala.commons:serializers:2.1.0"
        implementation "com.konghq:unirest-java:3.13.6:standalone"

        implementation "com.google.guava:guava:31.0.1-jre"
        implementation "commons-io:commons-io:2.11.0"

    }

    compileKotlin {
        kotlinOptions.javaParameters = true
        kotlinOptions.jvmTarget = "1.8"
    }

    shadowJar {
        archiveClassifier.set("")

        archiveFileName = "cloudsync.jar"
    }

    publishing {
        publications {
            shadow(MavenPublication) { publication ->
                project.shadow.component(publication)
            }
        }

        repositories {
            maven {
                name "scala"
                url "${property("artifactory_contextUrl")}/gradle-release"

                credentials {
                    username property("artifactory_user")
                    password property("artifactory_password")
                }
            }
        }
    }

    tasks.build.dependsOn(
        shadowJar,
        publishShadowPublicationToScalaRepository
    )
}

artifactory {
    this.contextUrl = property("artifactory_contextUrl")

    publish {
        repository {
            repoKey = property("artifactory_release_local")
            username = property("artifactory_user")
            password = property("artifactory_password")
            maven = true
        }
    }
}
